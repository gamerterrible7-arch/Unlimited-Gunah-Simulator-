<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Unlimited Gunah Simulator</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
      <main class="home-shell">
        <section id="menu-screen" class="home-screen" aria-labelledby="menu-heading">
          <p class="eyebrow">Unlimited Gunah Simulator</p>
          <h1 id="menu-heading">Welcome to unlimited Gunah simulator!</h1>
          <div class="menu-buttons">
            <button id="play-button" type="button">Play</button>
            <button id="options-button" type="button">Options</button>
            <button id="gunah-button" type="button">Gunah Count</button>
            <button id="exit-button" type="button">Exit</button>
          </div>
          <p id="exit-feedback" class="screen-feedback" role="status" aria-live="polite"></p>
        </section>

        <section id="options-screen" class="home-screen" aria-labelledby="options-heading" hidden>
          <p class="eyebrow">Options</p>
          <h1 id="options-heading" tabindex="-1">Choose difficulty</h1>
          <fieldset class="difficulty-options">
            <legend>Difficulty</legend>
            <label><input type="radio" name="difficulty" value="Easy"> Easy</label>
            <label><input type="radio" name="difficulty" value="Medium"> Medium</label>
            <label><input type="radio" name="difficulty" value="Hard"> Hard</label>
          </fieldset>
          <p id="difficulty-feedback" class="screen-feedback" aria-live="polite"></p>
          <button id="options-back" class="back-button" type="button">Back</button>
        </section>

        <section id="gunah-screen" class="home-screen" aria-labelledby="gunah-heading" hidden>
          <p class="eyebrow">Gunah Count</p>
          <h1 id="gunah-heading" tabindex="-1">Enter your gunah count</h1>
          <form id="gunah-form" class="gunah-form">
            <label for="gunah-input">Gunah count</label>
            <input id="gunah-input" name="gunahCount" type="number" step="1" required>
            <button type="submit">Check count</button>
          </form>
          <p id="gunah-feedback" class="screen-feedback" role="status" aria-live="polite"></p>
          <button id="gunah-back" class="back-button" type="button">Back</button>
        </section>
      </main>
      <footer class="site-footer">Game made by Naik CEO Mubashir Ahmad</footer>

      <script>
        const menuScreen = document.querySelector("#menu-screen");
        const optionsScreen = document.querySelector("#options-screen");
        const gunahScreen = document.querySelector("#gunah-screen");
        const screens = [menuScreen, optionsScreen, gunahScreen];

        function showScreen(screen) {
          screens.forEach((item) => {
            item.hidden = item !== screen;
          });
          const heading = screen.querySelector("h1");
          if (heading.hasAttribute("tabindex")) {
            heading.focus();
          }
        }

        document.querySelector("#play-button").addEventListener("click", () => {
          location.href = "play.html";
        });
        document.querySelector("#exit-button").addEventListener("click", () => {
          window.close();
          if (window.closed) {
            return;
          }
          if (history.length > 1) {
            history.back();
            return;
          }
          document.querySelector("#exit-feedback").textContent = "Your browser won't let this tab close itself. Close it using the browser controls.";
        });
        document.querySelector("#options-button").addEventListener("click", () => {
          showScreen(optionsScreen);
        });
        document.querySelector("#gunah-button").addEventListener("click", () => {
          document.querySelector("#gunah-feedback").textContent = "";
          showScreen(gunahScreen);
          document.querySelector("#gunah-input").focus();
        });
        document.querySelectorAll("input[name='difficulty']").forEach((option) => {
          option.addEventListener("change", () => {
            document.querySelector("#difficulty-feedback").textContent = `${option.value} selected.`;
          });
        });
        document.querySelector("#options-back").addEventListener("click", () => {
          showScreen(menuScreen);
          document.querySelector("#options-button").focus();
        });
        document.querySelector("#gunah-back").addEventListener("click", () => {
          showScreen(menuScreen);
          document.querySelector("#gunah-button").focus();
        });
        document.querySelector("#gunah-form").addEventListener("submit", (event) => {
          event.preventDefault();
          const count = Number(document.querySelector("#gunah-input").value);
          document.querySelector("#gunah-feedback").textContent = count > 100
            ? "wah ra ustad tum tuh saitan sa bhi badi cheez nikle"
            : "good good";
        });
      </script>
    </body>
</html>
